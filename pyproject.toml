[project]
name = "ultron"
version = "1.0.0"
description = "Production-grade voice/multimodal AI assistant with explicit 5-stage pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "supabase>=2.0.0",
    "groq>=0.5.0",
    "anthropic>=0.18.0",
    "faster-whisper>=1.0.0",
    "elevenlabs>=0.3.0",
    "azure-cognitiveservices-speech>=1.38.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

